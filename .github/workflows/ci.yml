name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - run: flutter pub get
      - name: Generated code is up to date
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,inbucket,edge-runtime,logflare,vector,supavisor
      - name: Database tests (RLS, versioning, idempotency)
        run: supabase test db
      - name: Unit, widget and two-device integration tests
        # goldens are rendered on Windows; font rasterization differs on Linux
        run: flutter test --exclude-tags golden

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build windows --release --dart-define-from-file=env.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: mybudget-windows
          path: build/windows/x64/runner/Release

  build-android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build apk --release --dart-define-from-file=env.example.json
      - uses: actions/upload-artifact@v4
        with:
          name: mybudget-android
          path: build/app/outputs/flutter-apk/app-release.apk
